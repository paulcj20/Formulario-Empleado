name: E2E Tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  e2e:
    runs-on: self-hosted

    defaults:
      run:
        # El runner (servicio "Servicio de red") no tiene una execution policy
        # asignada -> por defecto Restricted y bloquea cualquier script .ps1.
        # Bypass es solo para el proceso que ejecuta cada step, no cambia nada global.
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

    steps:
      - uses: actions/checkout@v4

      # ── Backend (Spring Boot) ─────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # Sin cache: el runner es persistente y ~/.m2 ya sobrevive entre corridas;
          # actions/cache solo suma una vuelta de red innecesaria en self-hosted.

      - name: Compilar y levantar backend
        working-directory: backend
        env:
          # H2 en memoria en modo compatible con Postgres (sin DB externa)
          SPRING_DATASOURCE_URL: "jdbc:h2:mem:empleados;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ""
        run: |
          # El runner es la misma máquina siempre: si una corrida anterior murió
          # sin llegar al paso de limpieza, puede quedar un backend viejo colgado del 8080.
          $stale = Get-NetTCPConnection -LocalPort 8080 -State Listen -ErrorAction SilentlyContinue
          if ($stale) {
            $stale.OwningProcess | Sort-Object -Unique | ForEach-Object { Stop-Process -Id $_ -Force -ErrorAction SilentlyContinue }
          }

          .\mvnw.cmd -q -DskipTests package
          $jar = (Get-Item target\*.jar | Select-Object -First 1).FullName
          $proc = Start-Process java -ArgumentList "-jar", $jar -PassThru -WindowStyle Hidden
          $proc.Id | Out-File backend.pid
          npx --yes wait-on tcp:8080 --timeout 90000

      # ── Frontend + Playwright ─────────────────────────
      - uses: actions/setup-node@v4
        with:
          # Debe coincidir con el Node/npm local que generó package-lock.json
          # (v24); con v20 "npm ci" resolvía distinto y fallaba con EUSAGE.
          node-version: "24"
          # Idem: sin cache de actions/cache, el cache local de npm ya persiste en el runner.

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador
        run: npx playwright install chromium

      - name: Correr tests E2E
        run: npx playwright test --project=chromium

      # ── Reporte HTML (siempre, falle o no) ────────────
      - name: Subir reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 15

      # Caddy ya sirve F:\Automations Data\playwright-reports en
      # kimitcms.duckdns.org/playwright-reports/ (mismo PC que el runner).
      - name: Publicar reporte HTML (para Kiwi)
        if: always()
        id: publicar_reporte
        run: |
          $dest = "F:\Automations Data\playwright-reports\${{ github.run_id }}"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item -Path playwright-report\* -Destination $dest -Recurse -Force
          "url=https://kimitcms.duckdns.org/playwright-reports/${{ github.run_id }}/index.html" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # ── Subir resultados a Kiwi TCMS (siempre) ────────
      # Python ya está instalado en el runner (máquina persistente);
      # actions/setup-python intentaba descargarlo y fallaba por la execution policy.
      - name: Reportar a Kiwi TCMS
        if: always()
        env:
          TCMS_PRODUCT: "Formulario de Alta Empleado / Servicio"
          TCMS_PRODUCT_VERSION: "1.0"
          TCMS_PLAN_ID: "1"
          TCMS_BUILD: "gh-${{ github.run_number }}-${{ github.sha }}"
          REPORT_URL: ${{ steps.publicar_reporte.outputs.url }}
        run: |
          pip install kiwitcms-junit.xml-plugin
          $env:HOME = $env:USERPROFILE
          @"
          [tcms]
          url = https://kimitcms.duckdns.org/json-rpc/
          username = PAULCJ20
          password = ${{ secrets.PAULCJ20 }}
          "@ | Set-Content "$env:USERPROFILE\.tcms.conf"
          python subir_kiwi.py results/junit.xml

      # ── Apagar el backend (en runner local no muere solo) ──
      - name: Detener backend
        if: always()
        working-directory: backend
        run: |
          if (Test-Path backend.pid) {
            Stop-Process -Id (Get-Content backend.pid) -Force -ErrorAction SilentlyContinue
            Remove-Item backend.pid
          }

      # ── Comentar en el PR si fallo ────────────────────
      - name: Comentar en el PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '❌ **Los tests E2E fallaron.**',
                '',
                `📊 [Ver la corrida](${runUrl}) — descargá el artifact \`playwright-report\` y abrí \`index.html\` para ver screenshots, video y trace del fallo.`,
                '',
                '🥝 Resultados también registrados en [Kiwi TCMS](https://kimitcms.duckdns.org).'
              ].join('\n')
            });
